<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hammad Quotex Bot</title>
<style>body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px} .card{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:20px auto} button{padding:15px 30px;font-size:18px;border-radius:10px;border:none;cursor:pointer;margin:5px} .red{background:#ef4444;color:white} .green{background:#22c55e;color:white} .signal{background:yellow;color:black;padding:20px;font-size:24px;font-weight:bold;border-radius:10px;margin:20px} .count{font-size:60px;font-weight:bold}</style>
</head><body>
<h1>🤖 HAMMAD QUOTEX BOT</h1>
<p>Strategy: 6 RED Candles → DOWN $1</p>
<div class="card">
<div class="count" id="count">0 / 6 RED</div>
<div id="signal"></div>
<button class="red" onclick="addRed()">🔴 RED Candle</button>
<button class="green" onclick="addGreen()">🟢 GREEN Candle</button>
<button onclick="reset()" style="background:gray;color:white">Reset</button>
</div>
<div class="card">
<p>Balance: $10 | Trade: $1 | Pair: EUR/USD</p>
<p id="status">Bot Ready - LIVE on Render ✅</p>
</div>
<script>
let reds=0;
function addRed(){reds++;document.getElementById('count').innerText=reds+' / 6 RED';if(reds>=6){document.getElementById('signal').innerHTML='<div class=signal>📉 SIGNAL: DOWN $1 - TRADE NOW!</div>';let a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');a.play();}}
function addGreen(){reds=0;document.getElementById('count').innerText='0 / 6 RED';document.getElementById('signal').innerHTML='';}
function reset(){reds=0;document.getElementById('count').innerText='0 / 6 RED';document.getElementById('signal').innerHTML='';}
</script>
</body></html>
